name: Build and Sign Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Prepare Environment
        run: |
          cp .env.example .env 2>/dev/null || touch .env

      - name: Decode Permanent Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "${GITHUB_WORKSPACE}/release-keystore.jks"

          if [ ! -s "${GITHUB_WORKSPACE}/release-keystore.jks" ]; then
            echo "ERROR: Keystore decoding failed"
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Signing passwords are missing"
            exit 1
          fi

          ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p build-artifacts
          cp "$APK" build-artifacts/NUBTK-Office-Hours-Signed-APK.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NUBTK-Office-Hours-Signed-APK
          path: build-artifacts/NUBTK-Office-Hours-Signed-APK.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NUBTK Office Hours ${{ github.ref_name }}
          files: build-artifacts/NUBTK-Office-Hours-Signed-APK.apk
          body: |
            NUBTK Office Hours Signed Release
            Application ID: com.aistudio.nubtkofficehours.qvnf
            Version: 1.2
            Version Code: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/release-keystore.jks"
